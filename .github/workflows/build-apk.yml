name: Build Aqsati APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/share/powershell /usr/share/swift || true
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget python3-pip \
            autoconf automake autoconf-archive m4 \
            libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libbz2-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            make gcc patch ninja-build ccache

      - name: Install Buildozer and Cython
        run: |
          pip install --user buildozer cython==0.29.36

      - name: Clone and patch python-for-android (16KB linker flags)
        run: |
          rm -rf p4a
          git clone --depth 1 https://github.com/kivy/python-for-android p4a
          cd p4a
          git fetch --depth 1 origin 58d21141f17c889bf8585f5665921d72028f8831
          git checkout FETCH_HEAD
          cd ..
          python3 << 'EOF'
          import pathlib
          p = pathlib.Path('p4a/pythonforandroid/archs.py')
          s = p.read_text()
          if 'max-page-size' in s:
              print('already patched')
          else:
              s = s.replace("    common_ldflags = ['-L{ctx_libs_dir}']",
                            "    common_ldflags = ['-L{ctx_libs_dir}', '-Wl,-z,max-page-size=16384', '-Wl,-z,common-page-size=16384']", 1)
              s = s.replace("        '-shared',",
                            "        '-shared',\n        '-Wl,-z,max-page-size=16384',\n        '-Wl,-z,common-page-size=16384',", 1)
              s = s.replace("        env['LDSHARED'] = env['CC'] + ' ' + ' '.join(self.common_ldshared)",
                            "        env['LDSHARED'] = env['CC'] + ' ' + ' '.join(self.common_ldshared)\n"
                            "        env['CMAKE_SHARED_LINKER_FLAGS'] = (env.get('CMAKE_SHARED_LINKER_FLAGS', '') + ' -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384').strip()", 1)
              p.write_text(s)
              print('patched archs.py OK')
          EOF
          grep -n "max-page-size" p4a/pythonforandroid/archs.py

      - name: Cache toolchain and package tarballs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer/android/platform/build-arm64-v8a/packages
          key: toolchain-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Wipe stale build outputs (force real build, keep tarballs)
        run: |
          rm -rf .buildozer/android/platform/build-arm64-v8a/dists
          rm -rf .buildozer/android/platform/build-arm64-v8a/build
          echo "tarballs kept:"; ls .buildozer/android/platform/build-arm64-v8a/packages 2>/dev/null || echo "(none yet)"

      - name: Prepare Android SDK cmdline-tools
        run: |
          SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $SDK_DIR/cmdline-tools
          mkdir -p $SDK_DIR/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager || true
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses > /dev/null 2>&1 || true

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Pre-seed recipe packages (bypass blocked downloads)
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a
          if [ -f recipe-packages.zip ]; then
            unzip -o recipe-packages.zip -d .buildozer/android/platform/build-arm64-v8a/
          fi
          if [ -f recipe-reportlab.zip ]; then
            unzip -o recipe-reportlab.zip -d .buildozer/android/platform/build-arm64-v8a/
          fi
          echo "=== pre-seeded packages ==="
          find .buildozer/android/platform/build-arm64-v8a/packages -type f | sort

      - name: Pre-download freetype (savannah server is flaky)
        run: |
          PKG_DIR=.buildozer/android/platform/build-arm64-v8a/packages/freetype
          mkdir -p $PKG_DIR
          cd $PKG_DIR
          if [ -f freetype-2.14.1.tar.gz ] && gzip -t freetype-2.14.1.tar.gz 2>/dev/null; then
            echo "freetype already cached - skipping download"
          else
            rm -f freetype-2.14.1.tar.gz .mark-freetype-2.14.1.tar.gz
            for url in \
              "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
              "https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" \
              "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" ; do
              echo "Trying: $url"
              curl -fSL --connect-timeout 20 --retry 5 --retry-delay 10 -o freetype-2.14.1.tar.gz "$url" && break
              sleep 10
            done
            gzip -t freetype-2.14.1.tar.gz
          fi
          touch .mark-freetype-2.14.1.tar.gz
          echo "=== freetype package dir ==="
          ls -la

      - name: Patch downloader (browser UA + GitHub mirror + fallback)
        run: |
          mkdir -p patches
          cat > patches/sitecustomize.py <<'PYEOF'
          import urllib.request as _ur
          import shutil as _sh

          def _fetch(req, filename):
              with _ur.urlopen(req, timeout=120) as r, open(filename, 'wb') as f:
                  _sh.copyfileobj(r, f)

          def _patched_urlretrieve(url, filename=None, reporthook=None, data=None):
              reqs = []
              if isinstance(url, str) and url.startswith(('http://', 'https://')):
                  ua = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'}
                  u2 = url
                  if 'github.com' in url and '/archive/' in url:
                      u2 = 'https://gh-proxy.com/' + url
                      reqs.append(_ur.Request(u2, headers=ua))
                  reqs.append(_ur.Request(url, headers=ua))
              else:
                  reqs.append(url)
              if filename is None:
                  import tempfile
                  filename = tempfile.mktemp()
              last = None
              for req in reqs:
                  try:
                      _fetch(req, filename)
                      last = None
                      break
                  except Exception as e:
                      last = e
              if last is not None:
                  raise last
              if reporthook:
                  try:
                      reporthook(1, 1, 1)
                  except Exception:
                      pass
              return filename, None

          _ur.urlretrieve = _patched_urlretrieve
          PYEOF
          echo "Patch installed"

      - name: Build APK
        run: |
          set -o pipefail
          export PATH=$PATH:~/.local/bin
          export PYTHONPATH=$GITHUB_WORKSPACE/patches:$PYTHONPATH
          export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
          rm -rf bin
          buildozer android debug 2>&1 | tee build.log

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "===== DOWNLOAD LINES BEFORE FAILURE ====="
          grep -n "Downloading" build.log | tail -8 || true
          echo "===== ERROR CONTEXT ====="
          grep -n -B3 "HTTPError\|Download failed\|403\|Command failed\|error:" build.log | head -50 || true

      - name: Verify 16 KB alignment
        if: success()
        run: |
          python3 << 'EOF'
          import glob, struct, sys
          files = glob.glob('.buildozer/android/platform/build-arm64-v8a/dists/**/libs/arm64-v8a/*.so', recursive=True)
          if not files:
              print('::error:: No native libs found - build did not actually happen!')
              sys.exit(1)
          bad = []
          for f in files:
              with open(f, 'rb') as fh:
                  eh = fh.read(64)
                  if eh[:4] != b'\x7fELF':
                      continue
                  phoff = struct.unpack('<Q', eh[32:40])[0]
                  phentsize = struct.unpack('<H', eh[54:56])[0]
                  phnum = struct.unpack('<H', eh[56:58])[0]
                  fh.seek(phoff)
                  min_align = None
                  for _ in range(phnum):
                      ph = fh.read(phentsize)
                      if len(ph) < 40:
                          break
                      p_type = struct.unpack('<I', ph[:4])[0]
                      if p_type == 1:
                          align = struct.unpack('<Q', ph[32:40])[0]
                          min_align = align if min_align is None else min(min_align, align)
                  if min_align and min_align < 16384:
                      bad.append((f, min_align))
          if bad:
              print('::error:: Found libs that are NOT 16KB aligned:')
              for f, a in bad:
                  print(f'  align={a}: {f}')
              sys.exit(1)
          print(f'OK: all {len(files)} native libs are 16KB aligned')
          EOF

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqsati-apk
          path: bin/*.apk
          if-no-files-found: error
